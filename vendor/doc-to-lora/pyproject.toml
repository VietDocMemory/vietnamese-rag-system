[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-to-lora"
version = "0.0.1"
description = "Vendored Doc-to-LoRA inference runtime from SakanaAI"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.6.0",
    "transformers==4.51.3",
    "peft==0.15.2",
    "accelerate==1.6.0",
    "datasets==3.6.0",
    "einops>=0.8.1",
    "jaxtyping>=0.3.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "opt-einsum>=3.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctx_to_lora = ["chat_templates/**/*.jinja"]
